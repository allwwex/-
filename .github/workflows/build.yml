name: Build Peak Cosmetics

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.5.1

      - name: Build mod
        run: ./gradlew clean build --stacktrace

      - name: Prepare release files
        run: |
          mkdir -p release
          cp build/libs/peak-cosmetics-1.0.0.jar release/PeakCosmetics-1.0.0+mc26.1.2.jar
          zip -r release/PeakCosmetics-26.1.2-source.zip . \
            -x '.git/*' '.gradle/*' 'build/*' 'release/*'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeakCosmetics-26.1.2
          path: release/*
          if-no-files-found: error
